# Manual rerun of NeuroSim compliance gate.

name: NeuroSim compliance

on:
  workflow_dispatch:

jobs:
  compliance:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
      - name: Compliance (bash)
        shell: bash
        working-directory: NeuroSim
        run: bash scripts/compliance.sh

